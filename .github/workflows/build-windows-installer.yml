
name: Build Ethics of War Windows Launcher

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer and portable app
    runs-on: windows-latest

    steps:
      - name: Check out game
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Find game project folder
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter package.json -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/](node_modules|\.git)[\\/]' }

          $game = $null
          foreach ($file in $files) {
            $dir = $file.DirectoryName
            $main = Join-Path $dir 'electron/main.cjs'
            $config = Join-Path $dir 'electron-builder.yml'
            try {
              $pkg = Get-Content $file.FullName -Raw | ConvertFrom-Json
              if ($pkg.scripts.'dist:win' -and (Test-Path $main) -and (Test-Path $config)) {
                $game = $dir
                break
              }
            } catch {}
          }

          if (-not $game) {
            throw 'Could not find Ethics of War project. Upload the complete build kit contents.'
          }

          "GAME_DIR=$game" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Found Ethics of War project at: $game"

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location $env:GAME_DIR
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows applications
        shell: pwsh
        run: |
          Set-Location $env:GAME_DIR
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows executables
        uses: actions/upload-artifact@v7
        with:
          name: Ethics-of-War-Windows-Installers
          path: '**/release/*.exe'
          if-no-files-found: error
          retention-days: 30
