appId: com.chronowithrow.ethicsofwar
productName: Ethics of War
asar: true
directories:
  output: release
files:
  - dist/**/*
  - electron/main.cjs
  - package.json
extraMetadata:
  main: electron/main.cjs
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Ethics of War
